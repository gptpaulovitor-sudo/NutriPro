<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando para NutriAx Disciplina...</title>
  <script>
    // Redirecionamento agnóstico: suporta GitHub Pages (/NutriPro/disciplina/) e domínio raiz (/disciplina/)
    const isNutriPro = window.location.pathname.includes('/NutriPro');
    let target = '/disciplina/' + window.location.search + window.location.hash;
    if (isNutriPro) {
      target = '/NutriPro/disciplina/' + window.location.search + window.location.hash;
    }
    window.location.replace(target);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/disciplina/">
  </noscript>
</head>
<body style="background:#090401;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;">
    <p style="font-size:1.1rem;font-weight:600;">Redirecionando para o aplicativo do paciente...</p>
    <p><a id="fallbackLink" href="/disciplina/" style="color:#ea580c;text-decoration:none;font-weight:bold;">Clique aqui se não for redirecionado automaticamente</a></p>
  </div>
  <script>
    if (window.location.pathname.includes('/NutriPro')) {
      const link = document.getElementById('fallbackLink');
      if (link) link.href = '/NutriPro/disciplina/';
    }
  </script>
</body>
</html>
