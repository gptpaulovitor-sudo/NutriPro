<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1a0c02" />
      <stop offset="100%" stop-color="#090401" />
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo escuro com cantos arredondados -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#431407" stroke-width="6" />

  <!-- Escudo geométrico externo (Chama de Foco & Disciplina) -->
  <polygon points="256,42 434,130 434,342 256,468 78,342 78,130" 
           fill="none" stroke="#ea580c" stroke-width="8" stroke-dasharray="16, 8" opacity="0.6" />
  
  <polygon points="256,62 418,140 418,330 256,446 94,330 94,140" 
           fill="#0c0502" stroke="url(#fireGrad)" stroke-width="6" />

  <!-- Símbolo Estilizado de Fogo / Chama de Consistência -->
  <path d="M 256,110 C 270,160 330,220 330,285 C 330,345 285,385 256,385 C 227,385 182,345 182,285 C 182,235 220,185 230,165 C 235,210 260,230 260,250 C 260,265 248,278 238,285 C 255,285 280,265 280,235 C 280,195 256,150 256,110 Z" 
        fill="url(#fireGrad)" filter="url(#glow)" />
  
  <!-- Núcleo de Foco Interno -->
  <path d="M 256,230 C 266,255 285,275 285,300 C 285,330 265,348 256,348 C 247,348 227,330 227,300 C 227,278 245,255 256,230 Z" 
        fill="url(#glowGrad)" />

  <!-- Ponto de Consistência Máxima (Score IDC) -->
  <circle cx="256" cy="315" r="8" fill="#ffffff" filter="url(#glow)" />

  <!-- Badge DISCIPLINA na parte inferior -->
  <g transform="translate(146, 398)">
    <rect width="220" height="34" rx="8" fill="#431407" stroke="#ea580c" stroke-width="2" />
    <text x="110" y="24" font-family="'JetBrains Mono', 'Arial Black', sans-serif" font-size="16" font-weight="900" 
          fill="#fed7aa" text-anchor="middle" letter-spacing="3">DISCIPLINA</text>
  </g>
</svg>
